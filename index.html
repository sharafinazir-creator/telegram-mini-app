<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mini App من</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>

        body {
            margin: 0;
            padding: 25px 15px;
            font-family: Arial, sans-serif;
            background: #f2f4f7;
            text-align: center;
        }

        .container {
            max-width: 400px;
            margin: auto;
        }

        .card {
            background: white;
            border-radius: 20px;
            padding: 25px;
            box-shadow: 0 5px 20px rgba(0,0,0,0.08);
        }

        .avatar {
            font-size: 60px;
            margin-bottom: 10px;
        }

        #userName {
            font-size: 24px;
            font-weight: bold;
        }

        #userId {
            color: #777;
            margin-top: 8px;
        }

        .score-title {
            margin-top: 30px;
            font-size: 18px;
        }

        #score {
            font-size: 55px;
            font-weight: bold;
            margin: 10px;
        }

        #addButton {
            width: 100%;
            padding: 17px;
            font-size: 20px;
            border: none;
            border-radius: 15px;
            cursor: pointer;
            background: #2196f3;
            color: white;
        }

        #addButton:active {
            transform: scale(0.95);
        }

    </style>

</head>


<body>

<div class="container">

    <div class="card">

        <div class="avatar">
            👤
        </div>

        <div id="userName">
            در حال دریافت...
        </div>

        <div id="userId">
            ...
        </div>


        <div class="score-title">
            🏆 امتیاز شما
        </div>

        <div id="score">
            0
        </div>


        <button id="addButton">
            ➕ افزایش امتیاز
        </button>

    </div>

</div>


<script>

    const tg = window.Telegram.WebApp;

    tg.ready();


    // اطلاعات کاربر
    const user = tg.initDataUnsafe.user;


    if (user) {

        document.getElementById("userName").textContent =
            "سلام " + (user.first_name || "دوست من") + " 👋";

        document.getElementById("userId").textContent =
            "ID: " + user.id;

    } else {

        document.getElementById("userName").textContent =
            "کاربر ناشناس";

        document.getElementById("userId").textContent =
            "شناسه دریافت نشد";

    }


    // امتیاز
    let savedScore =
        localStorage.getItem("my_score");

    let score =
        savedScore ? Number(savedScore) : 0;


    const scoreElement =
        document.getElementById("score");

    const button =
        document.getElementById("addButton");


    scoreElement.textContent = score;


    // افزایش امتیاز
    button.addEventListener("click", function () {

        score++;

        scoreElement.textContent = score;

        localStorage.setItem(
            "my_score",
            score
        );

    });

</script>

</body>

</html>
