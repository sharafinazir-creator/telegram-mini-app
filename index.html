<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>DOGS EarningBot</title>

  <script src="https://telegram.org/js/telegram-web-app.js"></script>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      background: #0b0b0f;
      color: #fff;
      font-family: Arial, sans-serif;
    }

    .app {
      max-width: 480px;
      margin: auto;
      padding: 20px;
      padding-bottom: 90px;
    }

    .header {
      display: flex;
      align-items: center;
      gap: 12px;
      margin-bottom: 20px;
    }

    .dog {
      width: 55px;
      height: 55px;
      background: #d6a84f;
      border-radius: 50%;
      display: flex;
      align-items: center;
      justify-content: center;
      font-size: 32px;
    }

    h1 {
      margin: 0;
      font-size: 22px;
    }

    .sub {
      color: #999;
      font-size: 13px;
      margin-top: 4px;
    }

    .card {
      background: #15151c;
      border: 1px solid #282832;
      border-radius: 18px;
      padding: 20px;
      margin-bottom: 15px;
    }

    .balance {
      text-align: center;
    }

    .balance-title {
      color: #999;
      font-size: 13px;
    }

    .balance-number {
      font-size: 34px;
      font-weight: bold;
      color: #e2b85c;
      margin: 8px 0;
    }

    .coin {
      font-size: 15px;
      color: #aaa;
    }

    .user {
      color: #ddd;
      font-size: 14px;
    }

    .level {
      color: #e2b85c;
      font-weight: bold;
      margin-top: 5px;
    }

    .mining-box {
      text-align: center;
    }

    .mining-status {
      font-size: 16px;
      margin-bottom: 10px;
    }

    .speed {
      color: #aaa;
      font-size: 13px;
      margin-bottom: 15px;
    }

    button {
      width: 100%;
      border: none;
      border-radius: 12px;
      padding: 14px;
      font-size: 15px;
      font-weight: bold;
      cursor: pointer;
    }

    .gold-btn {
      background: #d6a84f;
      color: #111;
    }

    .gold-btn:disabled {
      background: #555;
      color: #aaa;
      cursor: not-allowed;
    }

    .message {
      text-align: center;
      color: #aaa;
      font-size: 13px;
      min-height: 20px;
      margin-top: 10px;
    }

    .nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      background: #111116;
      border-top: 1px solid #292933;
      display: flex;
      justify-content: space-around;
      padding: 12px 5px;
    }

    .nav div {
      color: #888;
      font-size: 11px;
      text-align: center;
    }

    .nav div.active {
      color: #e2b85c;
    }
  </style>
</head>

<body>

  <div class="app">

    <div class="header">
      <div class="dog">🐕</div>
      <div>
        <h1>DOGS EarningBot</h1>
        <div class="sub">Mine DOGS • Earn • Grow</div>
      </div>
    </div>

    <div class="card balance">
      <div class="balance-title">Your Balance</div>

      <div class="balance-number" id="balance">
        0
      </div>

      <div class="coin">DOGS</div>
    </div>

    <div class="card">
      <div class="user">
        Welcome, <strong id="username">User</strong>
      </div>

      <div class="level" id="level">
        🥉 Free Miner
      </div>
    </div>

    <div class="card mining-box">

      <div class="mining-status" id="miningStatus">
        Ready to mine
      </div>

      <div class="speed">
        Mining speed:
        <strong id="speed">5 DOGS/hour</strong>
      </div>

      <button
        class="gold-btn"
        id="mineButton"
        onclick="startMining()"
      >
        🚀 Start Mining
      </button>

      <div class="message" id="message"></div>

    </div>

  </div>

  <div class="nav">
    <div class="active">🏠<br>Home</div>
    <div>⛏️<br>Mining</div>
    <div>🎯<br>Tasks</div>
    <div>👥<br>Referral</div>
    <div>💼<br>Wallet</div>
  </div>


<script>

  /* ==============================
     SUPABASE SETTINGS
     ============================== */

  const SUPABASE_URL = "YOUR_SUPABASE_URL";

  const SUPABASE_KEY =
    "YOUR_SUPABASE_PUBLISHABLE_KEY";


  /* ==============================
     TELEGRAM
     ============================== */

  const tg = window.Telegram.WebApp;

  tg.ready();
  tg.expand();

  const telegramUser =
    tg.initDataUnsafe?.user;


  /* ==============================
     APP STATE
     ============================== */

  let currentUser = null;


  /* ==============================
     CONNECT TO BACKEND
     ============================== */

  async function connectUser() {

    if (!telegramUser) {
      showMessage("Please open this app inside Telegram.");
      return;
    }

    try {

      const response = await fetch(
        SUPABASE_URL +
        "/functions/v1/telegram-user",
        {
          method: "POST",

          headers: {
            "Content-Type": "application/json",
            "apikey": SUPABASE_KEY
          },

          body: JSON.stringify({
            initData: tg.initData
          })
        }
      );

      const data = await response.json();

      if (!response.ok) {
        console.error(data);

        showMessage(
          "Unable to connect to server."
        );

        return;
      }

      currentUser = data.user;

      updateUI();

    } catch (error) {

      console.error(error);

      showMessage(
        "Connection error."
      );
    }
  }


  /* ==============================
     UPDATE UI
     ============================== */

  function updateUI() {

    if (!currentUser) return;

    document.getElementById("username").textContent =
      currentUser.first_name || "User";

    document.getElementById("balance").textContent =
      Number(currentUser.balance || 0).toLocaleString();

    document.getElementById("speed").textContent =
      Number(currentUser.mining_speed || 5) +
      " DOGS/hour";

    const level = Number(currentUser.level || 0);

    const names = [
      "🥉 Free Miner",
      "🥈 Bronze",
      "🥇 Silver",
      "🏆 Gold",
      "💎 Platinum",
      "💎 Diamond",
      "👑 Master",
      "⚡ Elite",
      "👑 Royal",
      "🔥 Legend",
      "🚀 Ultimate"
    ];

    document.getElementById("level").textContent =
      names[level] || "🥉 Free Miner";
  }


  /* ==============================
     START MINING
     ============================== */

  function startMining() {

    if (!currentUser) {

      showMessage(
        "Please wait for connection..."
      );

      return;
    }

    showMessage(
      "Mining system will be connected next."
    );
  }


  /* ==============================
     MESSAGE
     ============================== */

  function showMessage(text) {

    document.getElementById("message").textContent =
      text;
  }


  /* const SUPABASE_URL = "https://laiuyjthzvharbttaehy.supabase.co/rest/v1/";
     START APP
    const SUPABASE_KEY = "sb_publishable_mBorYuaLAS8KuAmePBnC6A_axve6-4-";  */

  connectUser();

</script>

</body>
  </html>
