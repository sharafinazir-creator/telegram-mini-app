<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>

    <meta charset="UTF-8">

    <meta name="viewport"
          content="width=device-width, initial-scale=1.0">

    <title>Mini App من</title>

    <!-- Telegram WebApp -->
    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>

        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px 20px;
        }

        h1 {
            font-size: 28px;
        }

        #user {
            font-size: 21px;
            margin: 30px 0;
        }

        #score {
            font-size: 40px;
            margin: 30px;
        }

        button {
            font-size: 20px;
            padding: 15px 30px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }

    </style>

</head>


<body>

    <h1>🎮 Mini App من</h1>

    <div id="user">
        در حال دریافت اطلاعات...
    </div>

    <div id="score">
        0
    </div>

    <button id="addButton">
        ➕ افزایش امتیاز
    </button>


    <script>

        // Telegram WebApp
        const tg = window.Telegram.WebApp;

        // آماده کردن برنامه
        tg.ready();


        // اطلاعات کاربر تلگرام
        const user = tg.initDataUnsafe.user;


        // نمایش اطلاعات کاربر
        if (user) {

            document.getElementById("user").innerHTML =
                "سلام " + (user.first_name || "دوست من") +
                " 👋<br><br>" +
                "شناسه شما: " + user.id;

        } else {

            document.getElementById("user").innerHTML =
                "کاربر تلگرام شناسایی نشد ❌";

        }


        // دریافت امتیاز ذخیره شده
        let savedScore = localStorage.getItem("my_score");

        let score = savedScore ? Number(savedScore) : 0;


        // عناصر صفحه
        const scoreElement =
            document.getElementById("score");

        const button =
            document.getElementById("addButton");


        // نمایش امتیاز
        scoreElement.textContent = score;


        // افزایش امتیاز
        button.addEventListener("click", function () {

            score = score + 1;

            scoreElement.textContent = score;

            localStorage.setItem("my_score", score);

        });

    </script>

</body>

</html>
