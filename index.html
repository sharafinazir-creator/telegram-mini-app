<!DOCTYPE html>
<html lang="fa" dir="rtl">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mini App من</title>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px 20px;
        }

        h1 {
            font-size: 28px;
        }

        #score {
            font-size: 40px;
            margin: 30px;
        }

        button {
            font-size: 20px;
            padding: 15px 30px;
            border: none;
            border-radius: 12px;
            cursor: pointer;
        }
    </style>
</head>

<body>

    <h1>🎮 Mini App من</h1>

    <p>سلام 👋 خوش آمدی!</p>

    <div id="score">0</div>

    <button id="addButton">
        ➕ افزایش امتیاز
    </button>

    <script>

        let score = 0;

        const scoreElement = document.getElementById("score");
        const button = document.getElementById("addButton");

        button.addEventListener("click", function () {

            score = score + 1;

            scoreElement.textContent = score;

        });

    </script>

</body>

</html>
