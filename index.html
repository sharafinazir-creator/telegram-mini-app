<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width,initial-scale=1.0">
<title>DOGS EarningBot</title>

<script src="https://telegram.org/js/telegram-web-app.js"></script>

<style>
*{box-sizing:border-box}

body{
margin:0;
background:#0b0b0f;
color:#fff;
font-family:Arial,sans-serif
}

.app{
max-width:480px;
margin:auto;
padding:20px 20px 90px
}

.header{
display:flex;
align-items:center;
gap:12px;
margin-bottom:20px
}

.dog{
width:55px;
height:55px;
background:#d6a84f;
border-radius:50%;
display:flex;
align-items:center;
justify-content:center;
font-size:32px
}

h1{
margin:0;
font-size:22px
}

.sub{
color:#999;
font-size:13px;
margin-top:4px
}

.card{
background:#15151c;
border:1px solid #282832;
border-radius:18px;
padding:20px;
margin-bottom:15px
}

.balance{text-align:center}

.balance-title{
color:#999;
font-size:13px
}

.balance-number{
font-size:34px;
font-weight:bold;
color:#e2b85c;
margin:8px 0
}

.coin{
color:#aaa;
font-size:15px
}

.user{
color:#ddd;
font-size:14px
}

.level{
color:#e2b85c;
font-weight:bold;
margin-top:6px
}

.mining-box{text-align:center}

.mining-status{
font-size:17px;
margin-bottom:10px
}

.speed{
color:#aaa;
font-size:13px;
margin-bottom:15px
}

.timer{
color:#e2b85c;
font-size:25px;
font-weight:bold;
margin:15px 0
}

button{
width:100%;
border:0;
border-radius:12px;
padding:14px;
font-size:15px;
font-weight:bold;
cursor:pointer
}

.gold-btn{
background:#d6a84f;
color:#111
}

.gold-btn:disabled{
background:#555;
color:#aaa
}

.message{
text-align:center;
color:#aaa;
font-size:13px;
min-height:20px;
margin-top:10px
}

.nav{
position:fixed;
bottom:0;
left:0;
right:0;
background:#111116;
border-top:1px solid #292933;
display:flex;
justify-content:space-around;
padding:12px 5px
}

.nav div{
color:#888;
font-size:11px;
text-align:center
}

.nav .active{
color:#e2b85c
}
</style>
</head>

<body>

<div class="app">

<div class="header">
<div class="dog">🐕</div>
<div>
<h1>DOGS EarningBot</h1>
<div class="sub">Mine DOGS • Earn • Grow</div>
</div>
</div>

<div class="card balance">
<div class="balance-title">Your Balance</div>
<div class="balance-number" id="balance">0</div>
<div class="coin">DOGS</div>
</div>

<div class="card">
<div class="user">
Welcome, <strong id="username">User</strong>
</div>

<div class="level" id="level">
🥉 Free Miner
</div>
</div>

<div class="card mining-box">

<div class="mining-status" id="miningStatus">
Ready to mine
</div>

<div class="speed">
Mining speed:
<strong id="speed">5 DOGS/hour</strong>
</div>

<div class="timer" id="timer">
04:00:00
</div>

<button
class="gold-btn"
id="mineButton"
onclick="startMining()">
🚀 Start Mining
</button>

<div class="message" id="message"></div>

</div>

</div>

<div class="nav">
<div class="active">🏠<br>Home</div>
<div>⛏️<br>Mining</div>
<div>🎯<br>Tasks</div>
<div>👥<br>Referral</div>
<div>💼<br>Wallet</div>
</div>

<script>

/* =========================
   SUPABASE
========================= */

const SUPABASE_URL =
"https://laiuyjthzvharbttaehy.supabase.co";

/*
  IMPORTANT:
  Put your own Supabase PUBLISHABLE KEY here.
  Do NOT put the Secret / Service Role key here.
*/

const SUPABASE_KEY =
"sb_publishable_mBorYuaLAS8KuAmePBnC6A_axve6-4-";


/* =========================
   TELEGRAM
========================= */

const tg = window.Telegram.WebApp;

tg.ready();
tg.expand();

const telegramUser = tg.initDataUnsafe?.user;


/* =========================
   VARIABLES
========================= */

let currentUser = null;
let currentSession = null;
let timerInterval = null;


/* =========================
   CONNECT USER
========================= */

async function connectUser(){

if(!telegramUser){

showMessage(
"Please open this app inside Telegram."
);

return;
}

try{

showMessage("Connecting...");

const response = await fetch(
SUPABASE_URL +
"/functions/v1/telegram-user-v2",
{
method:"POST",

headers:{
"Content-Type":"application/json",
"apikey":SUPABASE_KEY
},

body:JSON.stringify({
initData:tg.initData
})
}
);

const data = await response.json();

console.log("telegram-user-v2:",data);

if(!response.ok){

showMessage(
"Server error: " +
(data.error || response.status)
);

return;
}

if(!data.user){

showMessage("User data not received.");

return;
}

currentUser = data.user;

updateUI();

showMessage("Connected ✓");

/*
  First try the saved local mining session.
  This allows the timer to survive reopening Telegram.
*/

restoreSavedMining();

if(!currentSession){

await checkMining();

}

}catch(error){

console.error(error);

showMessage(
"Connection error: " +
error.message
);

}

}


/* =========================
   UPDATE UI
========================= */

function updateUI(){

if(!currentUser)return;

document.getElementById("username")
.textContent =
currentUser.first_name || "User";

document.getElementById("balance")
.textContent =
Number(
currentUser.balance || 0
).toLocaleString();

document.getElementById("speed")
.textContent =
Number(
currentUser.mining_speed || 5
) +
" DOGS/hour";

const level =
Number(currentUser.level || 0);

const names=[
"🥉 Free Miner",
"🥈 Bronze",
"🥇 Silver",
"🏆 Gold",
"💎 Platinum",
"💎 Diamond",
"👑 Master",
"⚡ Elite",
"👑 Royal",
"🔥 Legend",
"🚀 Ultimate"
];

document.getElementById("level")
.textContent =
names[level] ||
"🥉 Free Miner";

}


/* =========================
   SAVE MINING SESSION
========================= */

function saveMining(){

if(!currentSession)return;

try{

localStorage.setItem(
"dogs_mining_session",
JSON.stringify(currentSession)
);

}catch(error){

console.log("Save mining error:",error);

}

}


/* =========================
   RESTORE MINING SESSION
========================= */

function restoreSavedMining(){

try{

const saved =
localStorage.getItem(
"dogs_mining_session"
);

if(!saved)return;

const session =
JSON.parse(saved);

if(!session || !session.ends_at){

localStorage.removeItem(
"dogs_mining_session"
);

return;
}

const end =
new Date(session.ends_at).getTime();

if(end <= Date.now()){

localStorage.removeItem(
"dogs_mining_session"
);

return;
}

currentSession = session;

const button =
document.getElementById("mineButton");

button.disabled = true;

startTimer();

showMessage(
"Mining restored ✓"
);

}catch(error){

console.log(
"Restore mining error:",
error
);

}

}


/* =========================
   START MINING
========================= */

async function startMining(){

if(!currentUser){

showMessage("Please wait...");

return;
}

const button =
document.getElementById("mineButton");

button.disabled = true;

showMessage(
"Starting mining..."
);

try{

const response = await fetch(
SUPABASE_URL +
"/functions/v1/start-mining",
{
method:"POST",

headers:{
"Content-Type":"application/json",
"apikey":SUPABASE_KEY
},

body:JSON.stringify({
initData:tg.initData
})
}
);

const data = await response.json();

console.log(
"start-mining:",
data
);


/*
  IMPORTANT:
  If server says mining is already active,
  this is NOT an error.
*/

if(
data.session &&
data.success === false
){

currentSession =
data.session;

saveMining();

startTimer();

button.disabled = true;

showMessage(
"Mining is already active ✓"
);

return;
}


/*
  Normal successful start
*/

if(
response.ok &&
data.success &&
data.session
){

currentSession =
data.session;

saveMining();

showMessage(
"Mining started successfully! ✓"
);

startTimer();

return;
}


/*
  Real error
*/

throw new Error(
data.error ||
data.message ||
"Mining failed"
);

}catch(error){

console.error(error);

showMessage(
"Mining error: " +
error.message
);

button.disabled = false;

}

}


/* =========================
   CHECK MINING FROM SERVER
========================= */

async function checkMining(){

if(!currentUser)return;

try{

const url =
SUPABASE_URL +
"/rest/v1/mining_sessions" +
"?select=*" +
"&user_id=eq." +
currentUser.id +
"&claimed=eq.false" +
"&ends_at=gt." +
encodeURIComponent(
new Date().toISOString()
) +
"&order=created_at.desc" +
"&limit=1";

const response =
await fetch(
url,
{
headers:{
"apikey":SUPABASE_KEY
}
}
);

if(!response.ok){

console.log(
"Mining check failed:",
response.status
);

return;
}

const sessions =
await response.json();

if(sessions.length > 0){

currentSession =
sessions[0];

saveMining();

document.getElementById(
"mineButton"
).disabled = true;

startTimer();

showMessage(
"Mining restored ✓"
);

}

}catch(error){

console.error(
"Check mining error:",
error
);

}

}


/* =========================
   TIMER
========================= */

function startTimer(){

if(!currentSession)return;

clearInterval(timerInterval);

updateTimer();

timerInterval =
setInterval(
updateTimer,
1000
);

}


/* =========================
   UPDATE TIMER
========================= */

function updateTimer(){

if(!currentSession)return;

const end =
new Date(
currentSession.ends_at
).getTime();

const remaining =
Math.max(
0,
end - Date.now()
);

const totalSeconds =
Math.floor(
remaining / 1000
);

const hours =
Math.floor(
totalSeconds / 3600
);

const minutes =
Math.floor(
(totalSeconds % 3600) / 60
);

const seconds =
totalSeconds % 60;

document.getElementById(
"timer"
).textContent =
String(hours).padStart(2,"0") +
":" +
String(minutes).padStart(2,"0") +
":" +
String(seconds).padStart(2,"0");


/*
  Mining is active
*/

if(remaining > 0){

document.getElementById(
"miningStatus"
).textContent =
"⛏️ Mining in progress";

return;

}


/*
  Mining completed
*/

clearInterval(timerInterval);

document.getElementById(
"miningStatus"
).textContent =
"🎉 Mining complete";

const button =
document.getElementById(
"mineButton"
);

button.disabled = false;

button.textContent =
"💰 Claim Reward";

button.onclick =
claimReward;

showMessage(
"Your mining cycle is complete."
);

}


/* =========================
   CLAIM
========================= */

function claimReward(){

showMessage(
"Claim system will be connected next."
);

}


/* =========================
   MESSAGE
========================= */

function showMessage(text){

document.getElementById(
"message"
).textContent = text;

}


/* https://laiuyjthzvharbttaehy.supabase.co/rest/v1/
   START APP
sb_publishable_mBorYuaLAS8KuAmePBnC6A_axve6-4- */

connectUser();

</script>

</body>
   </html>
