<!DOCTYPE html>
<html lang="fa" dir="rtl">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Mini App من</title>

    <script src="https://telegram.org/js/telegram-web-app.js"></script>

    <style>
        body {
            font-family: Arial, sans-serif;
            text-align: center;
            padding: 40px 20px;
        }

        h1 {
            font-size: 28px;
        }

        #user {
            font-size: 22px;
            margin: 30px 0;
        }

        #score {
            font-size: 40px;
            margin: 30px;
        }

        button {
            font-size: 20px;
            padding: 15px 30px;
            border: none;
            border-radius: 12px;
        }
    </style>
</head>

<body>

    <h1>🎮 Mini App من</h1>

    <p id="user">در حال دریافت اطلاعات...</p>

    <div id="score">0</div>

    <button id="addButton">
        ➕ افزایش امتیاز
    </button>


    <script>

        // اتصال به Telegram
        const tg = window.Telegram.WebApp;

        // آماده کردن Mini App
        tg.ready();

        // اطلاعات کاربر
        const user = tg.initDataUnsafe.user;

        if (user) {

            document.getElementById("user").textContent =
                "سلام " + (user.first_name || "دوست من") + " 👋";

        } else {

            document.getElementById("user").textContent =
                "سلام 👋 خوش آمدی!";

        }


        // امتیاز ذخیره شده
        let savedScore = localStorage.getItem("my_score");

        let score = savedScore ? Number(savedScore) : 0;

        const scoreElement = document.getElementById("score");
        const button = document.getElementById("addButton");

        scoreElement.textContent = score;


        // افزایش امتیاز
        button.addEventListener("click", function () {

            score = score + 1;

            scoreElement.textContent = score;

            localStorage.setItem("my_score", score);

        });

    </script>

</body>
</html>
